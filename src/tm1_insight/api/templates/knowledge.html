{% extends "base.html" %}
{% block title %}Knowledge · TM1 Insight{% endblock %}
{% block content %}
<div class="page-head"><div><h1 class="page-title">TM1 Knowledge Extraction</h1><p class="page-sub">基于本地元数据提取对象事实、可观察行为和模式候选</p></div></div>
<div class="card"><label>Prefix / Keyword <input id="prefix" class="input" placeholder="BP 或 BP*"></label> <button class="btn ghost" onclick="scopePreview()">Scope Preview</button> <button class="btn primary" onclick="analyze()">Analyze</button> <button class="btn ghost" onclick="downloadPackage()">Export Knowledge ZIP</button><div id="progress" class="muted" style="margin-top:12px"></div><pre id="result" style="white-space:pre-wrap;overflow:auto"></pre></div>
{% endblock %}
{% block scripts %}<script>
let packageData=null;
async function scopePreview(){const p=document.getElementById('prefix').value;const status=document.getElementById('progress');status.textContent='Discovering scope…';try{const r=await fetch('/api/knowledge/scope',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prefix:p})});const j=await r.json();status.textContent=`Scope Preview · ${j.estimated_analysis} · Ready to analyze`;document.getElementById('result').textContent=JSON.stringify(j,null,2)}catch(e){status.textContent='Scope discovery failed: '+e}}
async function analyze(){const p=document.getElementById('prefix').value;const status=document.getElementById('progress');status.textContent='Step 1/6 · Object Discovery…';try{const r=await fetch('/api/knowledge/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prefix:p})});packageData=await r.json();status.textContent=`Completed · ${packageData.progress.current}/${packageData.progress.total} stages`;document.getElementById('result').textContent=JSON.stringify({scope:packageData.matched,processes:packageData.processes.map(x=>({process:x.process,role:x.observed_role,behavior:x.behavior_sequence.map(b=>b.behavior)})),pattern_candidates:packageData.pattern_candidates},null,2)}catch(e){status.textContent='Analysis failed: '+e}}
async function downloadPackage(){if(!packageData)await analyze();const r=await fetch('/api/knowledge/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prefix:document.getElementById('prefix').value})});if(!r.ok){document.getElementById('progress').textContent='Export failed';return}const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='TM1_Knowledge.zip';a.click();URL.revokeObjectURL(a.href)}
</script>{% endblock %}
