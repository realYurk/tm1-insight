{% set lineage_kind = 'process' %}
<form id="tr-search" class="object-swap" data-lineage-search="process" data-model="{{ model|default('') }}">
  <div class="lineage-search-field">
    <label for="ti-search">换一个 TI</label>
    <input id="ti-search" class="input" type="search" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="lineage-search-results" value="{{ ti }}" required maxlength="1000" autocomplete="off" placeholder="按名称或关键词查找 TI">
    <div id="lineage-search-results" class="search-results" role="listbox" aria-label="对象搜索结果" hidden></div>
  </div>
  <button class="btn primary" type="submit">查看</button>
  <button id="lineage-clear" class="btn ghost" type="button">清空</button>
  <button id="tr-cancel" class="btn ghost" type="button" {% if ti %}disabled{% endif %}>取消</button>
  <datalist id="tr-options"></datalist>
</form>
<p id="lineage-search-status" class="muted small" role="status" aria-live="polite"></p>
<details class="lineage-secondary"><summary>调用范围</summary><div class="cl-toolbar"><label>调用层数<input id="tr-depth" class="input" type="number" min="0" max="4" value="{{ depth|default(2) }}"></label><label>最多 TI<input id="tr-budget" class="input" type="number" min="1" max="120" value="{{ node_budget|default(60) }}"></label></div></details>
<p id="tr-status" role="status" aria-live="polite">{% if ti %}正在建立本地局部解析任务…{% else %}选择一个 TI 开始。{% endif %}</p><progress id="tr-progress" hidden></progress>

<section id="tr-result" hidden>
  <div class="lineage-layout">
    <div class="lineage-main">
      <details id="tr-diagram" open><summary>TI 调用图</summary><div id="tr-diagram-host"></div></details>
      <details><summary>调用参数与条件</summary><div id="tr-calls" class="cl-table-wrap"></div></details>
      <details id="tr-downstream"><summary>下游范围内的其他调用</summary><div id="tr-other-calls" class="cl-table-wrap"></div></details>
      <details><summary>Cube 读写与逐写入点证据</summary><div id="tr-writes" class="cl-table-wrap"></div></details>
    </div>
    <aside class="lineage-side" aria-label="TI 摘要"><div id="tr-summary" class="cl-detail"></div></aside>
  </div>
  <details><summary>导出</summary><div class="study-actions"><a id="tr-export" class="btn" download>可读报告</a><a id="tr-json" class="btn" download="TI-Reconstruction.json">结构化报告</a></div><div id="tr-evidence"></div></details>
</section>
