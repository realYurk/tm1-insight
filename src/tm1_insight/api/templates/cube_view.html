{% extends "base.html" %}
{% block title %}{{ cube.name }} · Cube{% endblock %}

{% block breadcrumb %}
<nav class="breadcrumb">
  <a href="/">概览</a><span class="sep">/</span>
  <a href="/cubes" id="back-to-list">Cube 浏览</a><span class="sep">/</span>
  <span class="current">{{ cube.name }}</span>
</nav>
{% endblock %}

{% block content %}
{% include "_cube_detail.html" %}
<div id="cube-formation" data-cube="{{ cube.name }}"></div>
{% endblock %}

{% block scripts %}
<link rel="stylesheet" href="/static/functional-flow.css?v=3">
<script src="/static/mermaid-viewer.js?v=3" defer></script>
<script src="/static/cube-formation.js?v=3" defer></script>
<script>
// 从列表页进来时，「返回列表」恢复上次的搜索词与页码（按模型隔离）
(function () {
  var a = document.getElementById('back-to-list');
  if (!a) return;
  var last = window.WorkbenchContext ? window.WorkbenchContext.recallList('cubes') : null;
  if (!last) {
    try { last = JSON.parse(sessionStorage.getItem('cubes-last') || '{}'); } catch (e) { last = null; }
  }
  if (!last) return;
  var params = new URLSearchParams();
  if (last.q) params.set('q', last.q);
  if (last.page && last.page > 1) params.set('page', last.page);
  if (last.name) params.set('name', last.name);
  var qs = params.toString();
  if (qs) a.href = '/cubes?' + qs;
})();

// 记录「来源 Cube」，供 Dimension / TI 页显示「返回来源」入口
(function () {
  if (!window.WorkbenchContext) return;
  var name = {{ cube.name|tojson }};
  if (!name) return;
  window.WorkbenchContext.rememberJump('dimensions', { from: 'cubes', cube: name, q: '', page: 1 });
  window.WorkbenchContext.rememberJump('process', { from: 'cubes', cube: name, q: '', page: 1 });
})();

// 写入 TI 列表：搜索过滤 + 分页（大结果集时避免一次渲染数百行）
(function () {
  var search = document.getElementById('writer-search');
  var rows = Array.prototype.slice.call(document.querySelectorAll('#writer-list .writer-row'));
  var filterCount = document.getElementById('writer-filter-count');
  var pageInfo = document.getElementById('writer-page-info');
  var prev = document.getElementById('writer-prev');
  var next = document.getElementById('writer-next');
  var PAGE_SIZE = 20;
  var keyword = '';
  var page = 1;
  var visible = rows;

  function apply() {
    visible = keyword
      ? rows.filter(function (r) { return r.dataset.name.indexOf(keyword) >= 0; })
      : rows;
    var totalPages = Math.max(1, Math.ceil(visible.length / PAGE_SIZE));
    page = Math.min(page, totalPages);
    rows.forEach(function (r) { r.hidden = true; });
    var start = (page - 1) * PAGE_SIZE;
    visible.slice(start, start + PAGE_SIZE).forEach(function (r) { r.hidden = false; });
    if (filterCount) {
      filterCount.textContent = keyword
        ? '筛选出 ' + visible.length + ' 个'
        : (visible.length > PAGE_SIZE ? '显示前 ' + Math.min(PAGE_SIZE, visible.length) + ' 个' : '');
    }
    if (pageInfo) pageInfo.textContent = '第 ' + page + ' / ' + totalPages + ' 页';
    if (prev) prev.disabled = page <= 1;
    if (next) next.disabled = page >= totalPages;
  }

  if (search) {
    search.addEventListener('input', function () {
      keyword = search.value.trim().toLowerCase();
      page = 1;
      apply();
    });
  }
  if (prev) prev.addEventListener('click', function () { page = Math.max(1, page - 1); apply(); });
  if (next) next.addEventListener('click', function () { page += 1; apply(); });
  apply();
})();
</script>
{% endblock %}
