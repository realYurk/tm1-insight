<dialog id="object-switcher" class="process-switcher" aria-labelledby="object-switcher-title" data-kind="{{ switch_kind }}" data-model="{{ research_model() }}" data-source="{{ source|default('') }}">
  <div class="list-toolbar"><h2 id="object-switcher-title">搜索 / 切换 {{ switch_label }}</h2><button type="button" class="btn ghost btn-sm" id="object-switcher-close">关闭 · Esc</button></div>
  <form id="object-switcher-form" class="process-switcher-form"><input id="object-switcher-query" type="search" maxlength="200" placeholder="按名称搜索全部 {{ switch_label }}" aria-label="搜索全部 {{ switch_label }}" autocomplete="off"><button class="btn primary btn-sm">搜索</button></form>
  <p id="object-switcher-status" role="status" aria-live="polite"></p><ul id="object-switcher-results" class="list"></ul>
  <div class="pagination"><button type="button" class="btn ghost btn-sm" id="object-switcher-prev" disabled>上一页</button><a id="object-switcher-list" class="btn ghost btn-sm" href="{{ switch_list }}">在完整列表中查看</a><button type="button" class="btn ghost btn-sm" id="object-switcher-next" disabled>下一页</button></div>
</dialog>
<script src="/static/object-switcher.js?v=1" defer></script>
