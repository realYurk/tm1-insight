[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tm1-insight"
version = "0.3.0"
description = "TM1 Insight：高性能 TM1 运维套件（Explorer / Audit / Graph 三视图统一元数据仓库）"
requires-python = ">=3.9"
dependencies = [
    # 上界约束：保持 Python 3.9 兼容（见 docs/PYTHON_COMPATIBILITY_1_0.md）。
    # 每个包的最高版本都经 PyPI requires-python 验证，同时支持 3.9 与 3.13。
    "fastapi>=0.110,<0.129",
    "uvicorn[standard]>=0.29,<0.40",
    "typer>=0.12,<0.24",
    "pydantic>=2.6,<2.14",
    "pydantic-settings>=2.2,<2.12",
    "TM1py>=2.0,<2.5",
    "duckdb>=1.0,<1.5",
    "pyarrow>=15.0,<22",
    "pandas>=2.2,<2.4",
    # numpy 存在硬性分界：<2.1 支持 3.9 但无 cp313 轮子；>=2.1 有 cp313 但弃用 3.9。
    # 故按 Python 版本用环境标记分流（详见 docs/PYTHON_COMPATIBILITY_1_0.md）。
    "numpy>=1.26,<2.1; python_version < '3.10'",
    "numpy>=2.1,<2.3; python_version >= '3.10'",
    "openpyxl>=3.1,<3.2",
    "jinja2>=3.1,<3.2",
    "python-multipart>=0.0.9,<0.0.21",
    "httpx>=0.27,<0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
tm1-insight = "tm1_insight.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tm1_insight = ["api/static/*", "api/templates/*"]

[tool.ruff]
line-length = 100
target-version = "py39"
