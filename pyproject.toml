[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tm1-suite"
version = "0.2.0"
description = "高性能 TM1 运维套件：Explorer / Audit / Graph 三视图统一元数据仓库"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "TM1py>=2.0",
    "duckdb>=1.0",
    "pyarrow>=15.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
tm1-suite = "tm1_suite.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tm1_suite = ["api/static/*", "api/templates/*"]

[tool.ruff]
line-length = 100
target-version = "py39"
